[project]
name = "moveinsync-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "1aryansharma1", email = "aryansharma052004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.4",
    "email-validator>=2.2.0",
    "groq>=0.31.0",
    "langgraph>=1.0.0",
    "PyJWT>=2.10.1",
    "psycopg>=3.2.3,<3.3",
    "python-multipart>=0.0.20",
    "sqlglot>=27.0.0",
    "SQLAlchemy>=2.0.36",
    "uvicorn[standard]>=0.33.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]

[project.scripts]
moveinsync-ai = "moveinsync_ai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
